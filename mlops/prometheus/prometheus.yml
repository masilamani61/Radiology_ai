global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files:
  - "/data/data/DA25S005/Radiology_ai/mlops/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: radiologyai_backend
    static_configs:
      - targets: ["localhost:8005"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["localhost:9093"]
